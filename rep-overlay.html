body{background:transparent;overflow:hidden;width:1920px;height:1080px;font-family:'Bebas Neue',sans-serif;}

#sirenOverlay{

}

.siren-flash{
  position:fixed;inset:0;
  background:rgba(255,20,20,0);
  animation:sirenFlash 0.5s infinite;
}
@keyframes sirenFlash{
  0%,100%{background:rgba(255,20,20,0);}
  50%{background:rgba(255,20,20,0.35);}
}
.siren-text{
  font-size:80px;letter-spacing:10px;

  animation:sirenText .5s infinite alternate;
  position:relative;z-index:1;
}
@keyframes sirenText{
  from{opacity:.6;transform:scale(.98);}
  to{opacity:1;transform:scale(1.02);}
}
.siren-sub{
  font-size:26px;letter-spacing:6px;
  color:rgba(255,100,100,.8);margin-top:10px;
  position:relative;z-index:1;

}

#bg{

#bg.show{background:rgba(0,0,0,0.85);}

#particles{position:fixed;inset:0;z-index:15;pointer-events:none;}

#stage{

.s-eyebrow{font-size:26px;letter-spacing:8px;color:rgba(255,255,255,.4);margin-bottom:14px;}
.s-title{

#chosenName.show{opacity:1;transform:scale(1);display:block;}
.s-badge{font-size:20px;letter-spacing:4px;color:rgba(255,208,0,.6);margin-top:14px;opacity:0;transition:opacity .5s;}
.s-badge.show{opacity:1;}

<style>

<script>

// ══ VIP JACKPOT — Canvas 60fps ══
let vipRAF = null;
let animActive = false; // true mientras corre la animación (normal o VIP)
let jpScanTimers = [];

// ── Sonido de alarma VIP ──
function playVIPAlarm(){
  const ac=getAC();if(!ac)return;
  const t=ac.currentTime;
  // Campanadas ascendentes elegantes — suspenso sin ser agresivo
  const notes=[392,523,659,784]; // Sol, Do, Mi, Sol (acorde mayor ascendente)
  notes.forEach((freq,i)=>{
    const st=t+i*0.42;
    // Tono principal suave (triangle en vez de sawtooth)
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';o.frequency.value=freq;
    g.gain.setValueAtTime(0,st);
    g.gain.linearRampToValueAtTime(.18,st+0.04);
    g.gain.exponentialRampToValueAtTime(.001,st+0.5);
    // Armónico brillante suave para dar "shimmer"
    const o2=ac.createOscillator(),g2=ac.createGain();
    o2.type='sine';o2.frequency.value=freq*2;
    g2.gain.setValueAtTime(0,st);
    g2.gain.linearRampToValueAtTime(.05,st+0.04);
    g2.gain.exponentialRampToValueAtTime(.001,st+0.4);
    o.connect(g);g.connect(ac.destination);
    o2.connect(g2);g2.connect(ac.destination);
    o.start(st);o.stop(st+0.55);
    o2.start(st);o2.stop(st+0.45);
    o.onended=()=>{try{o.disconnect();g.disconnect();o2.disconnect();g2.disconnect();}catch(e){}};
  });
  // Nota grave sostenida de fondo para dar cuerpo (sutil)
  const bass=ac.createOscillator(),bg=ac.createGain();
  bass.type='sine';bass.frequency.value=98; // Sol grave
  bg.gain.setValueAtTime(0,t);
  bg.gain.linearRampToValueAtTime(.08,t+0.3);
  bg.gain.exponentialRampToValueAtTime(.001,t+2);
  bass.connect(bg);bg.connect(ac.destination);
  bass.start(t);bass.stop(t+2.1);
  bass.onended=()=>{try{bass.disconnect();bg.disconnect();}catch(e){}};
}

// ── Sonidos del scan ──
function playScanTick(){
  const ac=getAC();if(!ac)return;
  const t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=600+Math.random()*300;
  g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.05);
}

// ── Inicio con alarma + jackpot ──
function triggerVIP(candidates, chosen){
  animActive=true;
  const alarm=document.getElementById('vipAlarm');
  alarm.classList.add('active');
  playVIPAlarm();
  setTimeout(()=>{
    alarm.classList.remove('active');
    startJackpot(candidates,chosen);
  },2000);
}

function startJackpot(candidates, chosen) {
  if(vipRAF){ cancelAnimationFrame(vipRAF); vipRAF=null; }
  jpScanTimers.forEach(t=>clearTimeout(t)); jpScanTimers=[];

  const stage = document.getElementById('jackpotStage');
  const canvas = document.getElementById('vipCanvas');
  const nameEl = document.getElementById('vipName');
  const labelEl = document.getElementById('vipLabel');
  const badgeEl = document.getElementById('vipBadge');
  const flash = document.getElementById('jpFlash');

  nameEl.className=''; nameEl.textContent='---';
  labelEl.className=''; badgeEl.className='';
  flash.classList.remove('show');
  document.getElementById('bg').className='jackpot show';
  document.getElementById('jpReveal').classList.remove('show');

  stage.classList.add('show');
  setTimeout(()=>labelEl.classList.add('show'),300);

  canvas.width = 1920; canvas.height = 1080;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;

  // ── Partículas sutiles — pocas, suaves, ascendentes ──
  const PARTICLE_COUNT = 45;
  const particles = [];
  for(let i=0;i<PARTICLE_COUNT;i++){
    particles.push({
      x: Math.random()*W,
      y: Math.random()*H,
      vy:-(0.2+Math.random()*0.5),
      vx:(Math.random()-0.5)*0.15,
      r: Math.random()*2+0.8,
      a: Math.random()*0.4+0.1,
      hue: 42+Math.random()*12
    });
  }

  // ── Fases ──
  let phase='scanning';
  const startTime=performance.now();
  const SCAN_FAST_END=1600, SCAN_SLOW_END=2600, LOCK_TIME=3000, DONE_TIME=5000;
  const pool=candidates.length>0?[...candidates]:[chosen||'VIP'];
  let scanIdx=0, lastScanTime=0, scanInterval=60;
  let revealGlow=0;

  function animate(now){
    const elapsed=now-startTime;
    ctx.clearRect(0,0,W,H);

    // Scanning: nombres ciclan y desaceleran
    if(phase==='scanning'){
      if(elapsed>SCAN_SLOW_END) phase='locked';
      else if(elapsed>SCAN_FAST_END) scanInterval=60+((elapsed-SCAN_FAST_END)/(SCAN_SLOW_END-SCAN_FAST_END))*280;
      if(now-lastScanTime>scanInterval){
        lastScanTime=now;
        nameEl.textContent=(pool[scanIdx%pool.length]||'???').substring(0,14).toUpperCase();
        scanIdx++;
      }
    }
    // Locked: nombre final, glow suave creciente
    if(phase==='locked'){
      nameEl.textContent=(chosen||'VIP').substring(0,14).toUpperCase();
      if(elapsed>=LOCK_TIME && phase==='locked'){
        nameEl.className='locked';
        badgeEl.classList.add('show');
        playJackpotWin();
        phase='reveal';
      }
    }
    if(phase==='reveal') revealGlow=Math.min(1,revealGlow+0.03);

    // ── Fondo: gradiente radial suave y limpio ──
    const bgGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.75);
    bgGrad.addColorStop(0,'rgba(18,12,2,0.55)');
    bgGrad.addColorStop(1,'rgba(0,0,0,0.9)');
    ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);

    // ── Halo central suave detrás del nombre ──
    const haloBase=phase==='reveal'?0.16+revealGlow*0.12:0.09;
    const haloR=340+Math.sin(elapsed*0.0015)*24;
    const halo=ctx.createRadialGradient(cx,cy,0,cx,cy,haloR);
    halo.addColorStop(0,`rgba(255,200,80,${haloBase})`);
    halo.addColorStop(0.6,`rgba(255,170,40,${haloBase*0.4})`);
    halo.addColorStop(1,'transparent');
    ctx.fillStyle=halo; ctx.fillRect(0,0,W,H);

    // ── Anillo fino y elegante ──
    const ringR=200+Math.sin(elapsed*0.002)*10;
    ctx.beginPath();
    ctx.arc(cx,cy,ringR,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,210,120,${phase==='reveal'?0.22+revealGlow*0.15:0.1})`;
    ctx.lineWidth=1.5;
    ctx.stroke();

    // ── Partículas ascendentes suaves ──
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
      const tw=0.7+Math.sin(elapsed*0.003+p.x)*0.3; // parpadeo suave
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},85%,68%,${p.a*tw})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*2.5,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},85%,68%,${p.a*tw*0.06})`;
      ctx.fill();
    });

    // Done → reveal final
    if(phase==='reveal'&&elapsed>DONE_TIME){
      stage.classList.remove('show');
      revealJackpot(chosen);
      cancelAnimationFrame(vipRAF); vipRAF=null;
      return;
    }

    vipRAF=requestAnimationFrame(animate);
  }
  vipRAF=requestAnimationFrame(animate);
}



function revealJackpot(name){
  const flash=document.getElementById('jpFlash');
  [0,130,260].forEach(d=>setTimeout(()=>{flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),90);},d));
  document.getElementById('jackpotStage').classList.remove('show');

  // Auto-ocultar después de 6s
  // Auto-transition after 6s
  setTimeout(()=>forceHideReveal(true), 6000);
  // Safety: force hide after 10s
  setTimeout(()=>forceHideReveal(false), 10000);
}

function forceHideReveal(activateAfter){
  const reveal=document.getElementById('jpReveal');
  reveal.style.opacity='0';
  setTimeout(()=>{
    reveal.style.display='none'; reveal.classList.remove('show');
    reveal.style.opacity='';

    document.getElementById('jackpotStage').classList.remove('show');
    stopParticles();
    if(activateAfter) activateRep(true);
  },500);
}

// ── Variables globales ──
const LS='rep_state';
let repUserId=null, repUsername=null, repIsSubscriber=false;
let ttsTimeout=null, msgTimeout=null;
let particles=[], pRAF=null;
let lastTrigger=0, lastClear=0, pendingRep=null;
let sirenTimer=null, lastSirenTs=0;
let lastTs=0, lastTts=0;

// ── AudioContext lazy ──
let _ac=null;
function getAC(){
  if(!_ac){ try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} }
  if(_ac.state!=='running') _ac.resume().catch(()=>{});
  return _ac;
}
setInterval(()=>{const ac=getAC();if(ac&&ac.state==='running')clearInterval&&null;},2000);

function playNote(freq,dur,vol,type,t,ac){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.05);
}

function playJackpotSpin(){
  const ac=getAC(); if(!ac)return;
  const t=ac.currentTime;
  [200,250,300,350].forEach((f,i)=>playNote(f,.15,.08,'sine',t+i*.08,ac));
}

function playJackpotWin(){
  const ac=getAC(); if(!ac)return;
  const t=ac.currentTime;
  [523,659,784,1047,1319].forEach((f,i)=>playNote(f,.3,.18,'triangle',t+i*.1,ac));
  setTimeout(()=>{const t2=ac.currentTime;playNote(1568,.5,.15,'triangle',t2,ac);},600);
}

// ── Partículas Canvas ──
function startParticles(burst){
  if(pRAF){cancelAnimationFrame(pRAF);pRAF=null;}
  const canvas=document.getElementById('vipCanvas');
  if(!canvas)return;
  canvas.width=1920;canvas.height=1080;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  particles=[];
  const count=burst?80:40;
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=burst?(2+Math.random()*5):(.3+Math.random()*1.2);
    particles.push({
      x:W/2+(Math.random()-.5)*200,y:H/2+(Math.random()-.5)*200,
      vx:Math.cos(angle)*speed*(burst?1:.3),vy:Math.sin(angle)*speed*(burst?1:.3),
      r:Math.random()*4+1,a:1,hue:35+Math.random()*25
    });
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      p.vx*=.97; p.vy*=.97;
      if(!burst){p.vx+=(Math.random()-.5)*.05;p.vy+=(Math.random()-.5)*.05;}
      p.a-=burst?.008:.003;
      if(p.a<=0){p.a=0;return;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},90%,65%,${p.a})`;ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},90%,65%,${p.a*.07})`;ctx.fill();
    });
    particles=particles.filter(p=>p.a>0);
    if(particles.length>0) pRAF=requestAnimationFrame(frame);
    else ctx.clearRect(0,0,W,H);
  }
  pRAF=requestAnimationFrame(frame);
}
function stopParticles(){
  if(pRAF){cancelAnimationFrame(pRAF);pRAF=null;}
  if(vipRAF){cancelAnimationFrame(vipRAF);vipRAF=null;}
  const c=document.getElementById('vipCanvas');
  if(c){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);}
  particles=[];
}

// ── TTS Voice ──
let vp={rate:.95,pitch:1,voice:null};
function pickRandomVoiceProfile(){
  const voices=window.speechSynthesis.getVoices().filter(v=>v.lang.startsWith('es'));
  if(voices.length>0) vp.voice=voices[Math.floor(Math.random()*voices.length)];
  vp.rate=.9+Math.random()*.2; vp.pitch=.9+Math.random()*.3;
}
window.speechSynthesis.onvoiceschanged=pickRandomVoiceProfile;

function speakTTS(text){
  if(!text) return;
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='es-MX'; utt.rate=vp.rate; utt.pitch=vp.pitch;
  if(vp.voice) utt.voice=vp.voice;
  window.speechSynthesis.speak(utt);
}

// ── Activate Rep ──
function activateRep(isSub){
  animActive=false;
  document.getElementById('jpReveal').classList.remove('show');
  document.getElementById('bg').className='';
  if(!pendingRep) return;
  repUserId=pendingRep.userId;
  repUsername=pendingRep.username;
  repIsSubscriber=isSub;
  pendingRep=null;
  pickRandomVoiceProfile();
  const hud=document.getElementById('repHud');
  const crown=document.getElementById('hudCrown');
  const name=document.getElementById('hudName');
  hud.className=isSub?'sub show':'normal show';
  crown.style.display=isSub?'inline':'none';
  name.textContent=(repUsername||'?').substring(0,16).toUpperCase();
  stopParticles();
}

// ══════ CONVOCATORIA: palabra + countdown en la zona del rep ══════
let convocaInt = null, lastConvocaTs = 0;

function iniciarConvocatoria(palabra, segs){
  if(convocaInt){ clearInterval(convocaInt); convocaInt=null; }

  const tts   = document.getElementById('ttsMsg');
  const tUser = document.getElementById('ttsMsgUser');
  const tText = document.getElementById('ttsMsgText');

  // Todo va en la caja de abajo: countdown + palabra lado a lado
  const PAL = String(palabra||'').toUpperCase();
  tts.classList.add('timer','show');
  tts.classList.remove('urgente');
  tUser.textContent = '';

  let queda = segs;
  const pinta = (n)=>{
    tText.innerHTML =
      '<span class="num">'+n+'</span>'+
      '<span class="sep"></span>'+
      '<span class="pal">'+PAL+'</span>';
  };
  pinta(queda);

  convocaInt = setInterval(()=>{
    queda--;
    pinta(queda > 0 ? queda : '¡YA!');
    if(queda <= 5 && queda > 0) tts.classList.add('urgente');
    if(queda <= 0){
      clearInterval(convocaInt); convocaInt=null;
      setTimeout(terminarConvocatoria, 1200);
    }
  }, 1000);
}

function terminarConvocatoria(){
  if(convocaInt){ clearInterval(convocaInt); convocaInt=null; }
  const tts = document.getElementById('ttsMsg');
  tts.classList.remove('timer','urgente','show');
  document.getElementById('ttsMsgText').innerHTML = '';
}

function clearRep(){
  terminarConvocatoria();
  animActive=false;
  // Cancelar animaciones en curso
  if(normalRAF){cancelAnimationFrame(normalRAF);normalRAF=null;}
  if(vipRAF){cancelAnimationFrame(vipRAF);vipRAF=null;}
  if(typeof stopNormalParticles==='function') stopNormalParticles();
  repUserId=null; repUsername=null; repIsSubscriber=false; pendingRep=null;
  document.getElementById('stage').classList.remove('show');
  document.getElementById('repHud').className='normal';
  document.getElementById('jackpotStage').classList.remove('show');
  document.getElementById('jpReveal').classList.remove('show');
  document.getElementById('bg').className='';
  stopParticles();
  jpScanTimers.forEach(t=>clearTimeout(t)); jpScanTimers=[];
}

// ── Animación selección normal — 60fps rAF, misma lógica ──
let normalRAF=null;
function startAnimation(candidates, chosen){
  animActive=true;
  if(normalRAF){cancelAnimationFrame(normalRAF);normalRAF=null;}
  const stage=document.getElementById('stage');
  const chosen2=document.getElementById('chosenName');
  const badge=document.getElementById('sBadge');
  stage.classList.remove('show');
  chosen2.classList.remove('show');
  badge.classList.remove('show');
  document.getElementById('repHud').className='normal'; // ocultar HUD durante animación
  void stage.offsetWidth;
  stage.classList.add('show');
  document.getElementById('bg').className='show';
  startNormalParticles(); // partículas decorativas

  const pool=candidates.length>0?[...candidates]:[chosen||'???'];
  let idx=0;
  const startT=performance.now();
  let lastSwap=0;
  // Fase 1: rápido 60ms por nombre, Fase 2: desacelera, Fase 3: nombre final
  const PHASE2=1800, PHASE3=3000;

  function frame(now){
    const elapsed=now-startT;
    // Velocidad: 60ms → 400ms progresivamente
    const speed=elapsed<PHASE2?60:60+((elapsed-PHASE2)/(PHASE3-PHASE2))*340;

    if(elapsed>=PHASE3){
      // Final
      chosen2.textContent=(chosen||'???').substring(0,16).toUpperCase();
      chosen2.classList.add('show');
      badge.classList.add('show');
      playSelectFanfare(); // sonido de selección
      burstNormalParticles(); // explosión de partículas
      setTimeout(()=>{
        stage.classList.remove('show');
        chosen2.classList.remove('show');
        badge.classList.remove('show');
        document.getElementById('bg').className='';
        stopNormalParticles();
        activateRep(false);
      },2000);
      return;
    }

    if(now-lastSwap>=speed){
      lastSwap=now;
      chosen2.textContent=(pool[idx%pool.length]||'???').substring(0,16).toUpperCase();
      chosen2.classList.add('show');
      playTick(); // tick en cada nombre
      idx++;
    }
    normalRAF=requestAnimationFrame(frame);
  }
  normalRAF=requestAnimationFrame(frame);
}

// ── Sonidos del 1vs1 normal ──
function playTick(){
  const ac=getAC();if(!ac)return;
  const t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=500+Math.random()*250;
  g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.05);
  o.onended=()=>{try{o.disconnect();g.disconnect();}catch(e){}};
}
function playSelectFanfare(){
  const ac=getAC();if(!ac)return;
  const t=ac.currentTime;
  [523,659,784,1047].forEach((f,i)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';o.frequency.value=f;
    const st=t+i*.09;
    g.gain.setValueAtTime(.22,st);g.gain.exponentialRampToValueAtTime(.001,st+.3);
    o.connect(g);g.connect(ac.destination);o.start(st);o.stop(st+.35);
    o.onended=()=>{try{o.disconnect();g.disconnect();}catch(e){}};
  });
}

// ── Partículas decorativas del 1vs1 normal ──
let normalPRAF=null, normalParticles=[], normalBurst=false;
function startNormalParticles(){
  const canvas=document.getElementById('particles');
  if(!canvas)return;
  canvas.width=1920;canvas.height=1080;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
  normalParticles=[];
  normalBurst=false;
  for(let i=0;i<70;i++){
    normalParticles.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,
      r:Math.random()*3+1,a:Math.random()*.5+.2,
      hue:35+Math.random()*25
    });
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    // Rayos de luz giratorios desde el centro
    const now=performance.now()*0.0004;
    ctx.save();
    ctx.translate(cx,cy);
    for(let i=0;i<8;i++){
      const ang=now+i*(Math.PI*2/8);
      const grad=ctx.createLinearGradient(0,0,Math.cos(ang)*900,Math.sin(ang)*900);
      grad.addColorStop(0,'rgba(255,200,0,0.04)');
      grad.addColorStop(1,'transparent');
      ctx.strokeStyle=grad;ctx.lineWidth=60;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*900,Math.sin(ang)*900);ctx.stroke();
    }
    ctx.restore();
    // Partículas
    normalParticles.forEach(p=>{
      if(normalBurst){
        const dx=p.x-cx,dy=p.y-cy;const d=Math.hypot(dx,dy)||1;
        p.vx+=dx/d*0.4;p.vy+=dy/d*0.4;p.a-=.012;
      }else{
        p.vx+=(Math.random()-.5)*.04;p.vy+=(Math.random()-.5)*.04;
        p.vx*=.98;p.vy*=.98;
      }
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},90%,65%,${Math.max(0,p.a)})`;ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},90%,65%,${Math.max(0,p.a)*0.08})`;ctx.fill();
    });
    normalPRAF=requestAnimationFrame(frame);
  }
  normalPRAF=requestAnimationFrame(frame);
}
function burstNormalParticles(){ normalBurst=true; }
function stopNormalParticles(){
  if(normalPRAF){cancelAnimationFrame(normalPRAF);normalPRAF=null;}
  const c=document.getElementById('particles');
  if(c){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);}
  normalParticles=[];
}

// ══ POLLING — rep_state ══
setInterval(()=>{
  try{
    const raw=localStorage.getItem(LS); if(!raw)return;
    const s=JSON.parse(raw); if(!s.ts||s.ts===lastTs)return;
    lastTs=s.ts;
    // Convocatoria: palabra + countdown en la zona del rep
    if(s.convocaTs && s.convocaTs!==lastConvocaTs){
      lastConvocaTs=s.convocaTs;
      if(s.convocaPalabra) iniciarConvocatoria(s.convocaPalabra, s.convocaSegs||30);
      else terminarConvocatoria();
      return;
    }
    if(s.trigger&&s.trigger!==lastTrigger){
      lastTrigger=s.trigger;
      pendingRep={userId:s.repUserId,username:s.repUsername,isMember:!!s.repIsMember};
      if(s.repIsMember) triggerVIP(s.candidates||[],s.chosen);
      else startAnimation(s.candidates||[],s.chosen);
    }
    if(s.clear&&s.clear!==lastClear){lastClear=s.clear;clearRep();}
  }catch(e){}
},300);

// ══ POLLING — TTS mensajes ══
setInterval(()=>{
  try{
    const raw=localStorage.getItem('rep_message'); if(!raw)return;
    const s=JSON.parse(raw); if(!s.ts||s.ts===lastTts)return;
    lastTts=s.ts;
    const ttsEl=document.getElementById('ttsMsg');
    const userEl=document.getElementById('ttsMsgUser');
    const textEl=document.getElementById('ttsMsgText');
    // Mute: cancelar voz y ocultar mensaje
    if(s.userId==='__mute__'||!s.text){
      window.speechSynthesis.cancel();
      ttsEl.classList.remove('show');
      return;
    }
    // Durante la animación: consumir el mensaje pero NO mostrarlo ni hablarlo
    if(animActive) return;
    userEl.textContent=(repUsername||s.username||'').toUpperCase();
    textEl.textContent=s.text;
    ttsEl.classList.add('show');
    speakTTS(s.text);
    if(msgTimeout) clearTimeout(msgTimeout);
    msgTimeout=setTimeout(()=>ttsEl.classList.remove('show'),5000);
  }catch(e){}
},100);
