<script>

// ══ VIP JACKPOT — Canvas 60fps ══
let vipRAF = null;
let jpScanTimers = [];

// ── Sonido de alarma VIP ──
function playVIPAlarm(){
  const ac=getAC();if(!ac)return;
  const t=ac.currentTime;
  // Sirena sweep
  for(let i=0;i<5;i++){
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sawtooth';
    const st=t+i*0.38;
    o.frequency.setValueAtTime(280,st);
    o.frequency.linearRampToValueAtTime(560,st+0.18);
    o.frequency.linearRampToValueAtTime(280,st+0.36);
    g.gain.setValueAtTime(.2,st);g.gain.setValueAtTime(.18,st+0.35);g.gain.linearRampToValueAtTime(0,st+0.38);
    // Distorsión leve
    const wc=ac.createWaveShaper();const curve=new Float32Array(256);
    for(let k=0;k<256;k++){const x=k*2/255-1;curve[k]=Math.tanh(x*3);}
    wc.curve=curve;
    o.connect(wc);wc.connect(g);g.connect(ac.destination);
    o.start(st);o.stop(st+0.4);
  }
}

// ── Sonidos del scan ──
function playScanTick(){
  const ac=getAC();if(!ac)return;
  const t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=600+Math.random()*300;
  g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.05);
}

// ── Inicio con alarma + jackpot ──
function triggerVIP(candidates, chosen){
  const alarm=document.getElementById('vipAlarm');
  alarm.classList.add('active');
  playVIPAlarm();
  setTimeout(()=>{
    alarm.classList.remove('active');
    startJackpot(candidates,chosen);
  },2000);
}

function startJackpot(candidates, chosen) {
  // Limpiar animación previa
  if(vipRAF){ cancelAnimationFrame(vipRAF); vipRAF=null; }
  jpScanTimers.forEach(t=>clearTimeout(t)); jpScanTimers=[];

  const stage = document.getElementById('jackpotStage');
  const canvas = document.getElementById('vipCanvas');
  const nameEl = document.getElementById('vipName');
  const labelEl = document.getElementById('vipLabel');
  const badgeEl = document.getElementById('vipBadge');
  const flash = document.getElementById('jpFlash');

  // Reset
  nameEl.className=''; nameEl.textContent='---';
  labelEl.className=''; badgeEl.className='';
  flash.classList.remove('show');
  document.getElementById('bg').className='jackpot show';
  document.getElementById('jpReveal').classList.remove('show');

  stage.classList.add('show');
  setTimeout(()=>labelEl.classList.add('show'),300);

  // ── Canvas setup ──
  canvas.width = 1920; canvas.height = 1080;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;

  // ── Partículas ──
  const PARTICLE_COUNT = 120;
  const particles = [];
  for(let i=0;i<PARTICLE_COUNT;i++){
    particles.push({
      x: cx + (Math.random()-0.5)*W*0.8,
      y: cy + (Math.random()-0.5)*H*0.8,
      vx:(Math.random()-0.5)*1.2,
      vy:(Math.random()-0.5)*1.2,
      r: Math.random()*3+1,
      a: Math.random()*0.7+0.15,
      hue: 35+Math.random()*25,
      phase:'idle'
    });
  }

  // Burst particles (hidden until reveal)
  const burstParticles = [];
  for(let i=0;i<80;i++){
    const angle = (i/80)*Math.PI*2;
    burstParticles.push({
      x:cx, y:cy,
      vx:Math.cos(angle)*(4+Math.random()*6),
      vy:Math.sin(angle)*(4+Math.random()*6),
      r:Math.random()*5+2,
      a:1, active:false, hue:40+Math.random()*20,
      trail:[]
    });
  }

  // ── Estado de animación ──
  let phase = 'scanning'; // scanning → locking → locked → burst → done
  const startTime = performance.now();
  const SCAN_FAST_END = 2200;   // ms
  const SCAN_SLOW_END = 3200;   // ms
  const LOCK_TIME = 3700;       // ms - flash & freeze
  const BURST_TIME = 3800;      // ms - particles explode
  const DONE_TIME  = 7000;      // ms - fade out, show reveal

  const pool = candidates.length > 0 ? [...candidates] : [chosen||'VIP'];
  let scanIdx = 0;
  let lastScanTime = 0;
  let scanInterval = 55;

  function animate(now) {
    const elapsed = now - startTime;
    ctx.clearRect(0,0,W,H);

    // ── Fase de scanning ──
    if(phase==='scanning'){
      if(elapsed > SCAN_SLOW_END) phase='locked';
      else if(elapsed > SCAN_FAST_END) scanInterval = 55 + ((elapsed-SCAN_FAST_END)/(SCAN_SLOW_END-SCAN_FAST_END))*350;

      if(now - lastScanTime > scanInterval){
        lastScanTime = now;
        nameEl.textContent = (pool[scanIdx%pool.length]||'???').substring(0,14).toUpperCase();
        scanIdx++;
        playScanTick();
      }
    }

    // ── Fase locked ──
    if(phase==='locked'){
      if(elapsed < LOCK_TIME){
        nameEl.textContent = (chosen||'VIP').substring(0,14).toUpperCase();
        nameEl.className = '';
      } else {
        // Flash!
        flash.classList.add('show');
        setTimeout(()=>flash.classList.remove('show'),100);
        setTimeout(()=>{flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),80);},220);
        nameEl.className = 'locked';
        badgeEl.classList.add('show');
        playJackpotWin();
        phase = 'burst';
        // Activar burst particles
        burstParticles.forEach(p=>{p.x=cx;p.y=cy;p.active=true;p.a=1;});
      }
    }

    // ── Fondo oscuro con vignette ──
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.7);
    grad.addColorStop(0,'rgba(10,5,0,0.7)');
    grad.addColorStop(1,'rgba(0,0,0,0.92)');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

    // ── Grid lines (efecto señal) ──
    ctx.strokeStyle='rgba(255,180,0,0.025)';
    ctx.lineWidth=1;
    for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    // ── Scan line (como TV) ──
    if(phase==='scanning'||phase==='locked'){
      const scanY = ((elapsed*0.3)%H);
      const lineGrad = ctx.createLinearGradient(0,scanY-4,0,scanY+4);
      lineGrad.addColorStop(0,'transparent');
      lineGrad.addColorStop(0.5,'rgba(255,200,0,0.08)');
      lineGrad.addColorStop(1,'transparent');
      ctx.fillStyle=lineGrad; ctx.fillRect(0,scanY-4,W,8);
    }

    // ── Ring de luz central ──
    const pulseR = 200 + Math.sin(elapsed*0.003)*20;
    const ringGrad = ctx.createRadialGradient(cx,cy,pulseR-8,cx,cy,pulseR+8);
    const ringA = phase==='burst' ? 0 : 0.12;
    ringGrad.addColorStop(0,'transparent');
    ringGrad.addColorStop(0.5,`rgba(255,200,0,${ringA})`);
    ringGrad.addColorStop(1,'transparent');
    ctx.fillStyle=ringGrad; ctx.fillRect(0,0,W,H);

    // ── Partículas de fondo ──
    particles.forEach(p=>{
      if(phase==='burst'){
        // Convergen al centro durante burst
        const dx=cx-p.x, dy=cy-p.y;
        p.vx+=dx*0.002; p.vy+=dy*0.002;
        p.a=Math.max(0,p.a-0.015);
      } else {
        p.vx+=(Math.random()-0.5)*0.05;
        p.vy+=(Math.random()-0.5)*0.05;
        p.vx*=0.98; p.vy*=0.98;
      }
      p.x+=p.vx; p.y+=p.vy;
      // Wrap around
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},90%,65%,${p.a})`;
      ctx.fill();
      // Glow
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},90%,65%,${p.a*0.08})`;
      ctx.fill();
    });

    // ── Burst particles ──
    if(phase==='burst'||phase==='done'){
      burstParticles.forEach(p=>{
        if(!p.active) return;
        p.trail.push({x:p.x,y:p.y,a:p.a});
        if(p.trail.length>8) p.trail.shift();
        // Draw trail
        p.trail.forEach((tp,i)=>{
          ctx.beginPath();
          ctx.arc(tp.x,tp.y,p.r*(i/p.trail.length),0,Math.PI*2);
          ctx.fillStyle=`hsla(${p.hue},100%,65%,${tp.a*0.3*(i/p.trail.length)})`;
          ctx.fill();
        });
        p.vx*=0.95; p.vy*=0.95;
        p.x+=p.vx; p.y+=p.vy;
        p.a-=0.012;
        if(p.a<=0) p.active=false;
        // Draw particle
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`hsla(${p.hue},100%,70%,${p.a})`;
        ctx.fill();
      });
    }

    // ── Glow central durante scanning ──
    if(phase==='scanning'||phase==='locked'){
      const intensity = phase==='locked'?0.25:0.12;
      const cgGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,300);
      cgGrad.addColorStop(0,`rgba(255,180,0,${intensity})`);
      cgGrad.addColorStop(1,'transparent');
      ctx.fillStyle=cgGrad; ctx.fillRect(0,0,W,H);
    }

    // ── Done: transición al reveal ──
    if(phase==='burst'&&elapsed>DONE_TIME){
      phase='done';
      stage.classList.remove('show');
      revealJackpot(chosen);
      cancelAnimationFrame(vipRAF); vipRAF=null;
      return;
    }

    vipRAF = requestAnimationFrame(animate);
  }

  vipRAF = requestAnimationFrame(animate);
  // startParticles ya está integrado en la animación principal de canvas
}



function revealJackpot(name){
  const flash=document.getElementById('jpFlash');
  [0,130,260].forEach(d=>setTimeout(()=>{flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),90);},d));
  document.getElementById('jackpotStage').classList.remove('show');
  document.getElementById('bg').className='jackpot show';
  const reveal=document.getElementById('jpReveal');
  document.getElementById('jpWinnerName').textContent=(name||'???').toUpperCase();
  document.getElementById('jpSubBadge').classList.remove('show');
  reveal.classList.remove('show'); void reveal.offsetWidth; reveal.classList.add('show');
  setTimeout(()=>document.getElementById('jpSubBadge').classList.add('show'),700);
  // Auto-ocultar después de 6s
  // Auto-transition after 6s
  setTimeout(()=>forceHideReveal(true), 6000);
  // Safety: force hide after 10s
  setTimeout(()=>forceHideReveal(false), 10000);
}

function forceHideReveal(activateAfter){
  const reveal=document.getElementById('jpReveal');
  reveal.style.opacity='0';
  setTimeout(()=>{
    reveal.style.display='none'; reveal.classList.remove('show');
    reveal.style.opacity='';
    document.getElementById('bg').className='';
    document.getElementById('jackpotStage').classList.remove('show');
    stopParticles();
    if(activateAfter) activateRep(true);
  },500);
}

// ── Variables globales ──
const LS='rep_state';
let repUserId=null, repUsername=null, repIsSubscriber=false;
let ttsTimeout=null, msgTimeout=null;
let particles=[], pRAF=null;
let lastTrigger=0, lastClear=0, pendingRep=null;
let sirenTimer=null, lastSirenTs=0;
let lastTs=0, lastTts=0;

// ── AudioContext lazy ──
let _ac=null;
function getAC(){
  if(!_ac){ try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} }
  if(_ac.state!=='running') _ac.resume().catch(()=>{});
  return _ac;
}
setInterval(()=>{const ac=getAC();if(ac&&ac.state==='running')clearInterval&&null;},2000);

function playNote(freq,dur,vol,type,t,ac){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.05);
}

function playJackpotSpin(){
  const ac=getAC(); if(!ac)return;
  const t=ac.currentTime;
  [200,250,300,350].forEach((f,i)=>playNote(f,.15,.08,'sine',t+i*.08,ac));
}

function playJackpotWin(){
  const ac=getAC(); if(!ac)return;
  const t=ac.currentTime;
  [523,659,784,1047,1319].forEach((f,i)=>playNote(f,.3,.18,'triangle',t+i*.1,ac));
  setTimeout(()=>{const t2=ac.currentTime;playNote(1568,.5,.15,'triangle',t2,ac);},600);
}

// ── Partículas Canvas ──
function startParticles(burst){
  if(pRAF){cancelAnimationFrame(pRAF);pRAF=null;}
  const canvas=document.getElementById('vipCanvas');
  if(!canvas)return;
  canvas.width=1920;canvas.height=1080;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  particles=[];
  const count=burst?80:40;
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=burst?(2+Math.random()*5):(.3+Math.random()*1.2);
    particles.push({
      x:W/2+(Math.random()-.5)*200,y:H/2+(Math.random()-.5)*200,
      vx:Math.cos(angle)*speed*(burst?1:.3),vy:Math.sin(angle)*speed*(burst?1:.3),
      r:Math.random()*4+1,a:1,hue:35+Math.random()*25
    });
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      p.vx*=.97; p.vy*=.97;
      if(!burst){p.vx+=(Math.random()-.5)*.05;p.vy+=(Math.random()-.5)*.05;}
      p.a-=burst?.008:.003;
      if(p.a<=0){p.a=0;return;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},90%,65%,${p.a})`;ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},90%,65%,${p.a*.07})`;ctx.fill();
    });
    particles=particles.filter(p=>p.a>0);
    if(particles.length>0) pRAF=requestAnimationFrame(frame);
    else ctx.clearRect(0,0,W,H);
  }
  pRAF=requestAnimationFrame(frame);
}
function stopParticles(){
  if(pRAF){cancelAnimationFrame(pRAF);pRAF=null;}
  if(vipRAF){cancelAnimationFrame(vipRAF);vipRAF=null;}
  const c=document.getElementById('vipCanvas');
  if(c){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);}
  particles=[];
}

// ── TTS Voice ──
let vp={rate:.95,pitch:1,voice:null};
function pickRandomVoiceProfile(){
  const voices=window.speechSynthesis.getVoices().filter(v=>v.lang.startsWith('es'));
  if(voices.length>0) vp.voice=voices[Math.floor(Math.random()*voices.length)];
  vp.rate=.9+Math.random()*.2; vp.pitch=.9+Math.random()*.3;
}
window.speechSynthesis.onvoiceschanged=pickRandomVoiceProfile;

function speakTTS(text){
  if(!text) return;
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='es-MX'; utt.rate=vp.rate; utt.pitch=vp.pitch;
  if(vp.voice) utt.voice=vp.voice;
  window.speechSynthesis.speak(utt);
}

// ── Activate Rep ──
function activateRep(isSub){
  document.getElementById('jpReveal').classList.remove('show');
  document.getElementById('bg').className='';
  if(!pendingRep) return;
  repUserId=pendingRep.userId;
  repUsername=pendingRep.username;
  repIsSubscriber=isSub;
  pendingRep=null;
  pickRandomVoiceProfile();
  const hud=document.getElementById('repHud');
  const crown=document.getElementById('hudCrown');
  const name=document.getElementById('hudName');
  hud.className=isSub?'sub show':'normal show';
  crown.style.display=isSub?'inline':'none';
  name.textContent=(repUsername||'?').substring(0,16).toUpperCase();
  stopParticles();
}

function clearRep(){
  // Cancelar animaciones en curso
  if(normalRAF){cancelAnimationFrame(normalRAF);normalRAF=null;}
  if(vipRAF){cancelAnimationFrame(vipRAF);vipRAF=null;}
  repUserId=null; repUsername=null; repIsSubscriber=false; pendingRep=null;
  document.getElementById('stage').classList.remove('show');
  document.getElementById('repHud').className='normal';
  document.getElementById('jackpotStage').classList.remove('show');
  document.getElementById('jpReveal').classList.remove('show');
  document.getElementById('bg').className='';
  stopParticles();
  jpScanTimers.forEach(t=>clearTimeout(t)); jpScanTimers=[];
}

// ── Animación selección normal — 60fps rAF, misma lógica ──
let normalRAF=null;
function startAnimation(candidates, chosen){
  if(normalRAF){cancelAnimationFrame(normalRAF);normalRAF=null;}
  const stage=document.getElementById('stage');
  const chosen2=document.getElementById('chosenName');
  const badge=document.getElementById('sBadge');
  stage.classList.remove('show');
  chosen2.classList.remove('show');
  badge.classList.remove('show');
  document.getElementById('repHud').className='normal'; // ocultar HUD durante animación
  void stage.offsetWidth;
  stage.classList.add('show');
  document.getElementById('bg').className='show';

  const pool=candidates.length>0?[...candidates]:[chosen||'???'];
  let idx=0;
  const startT=performance.now();
  let lastSwap=0;
  // Fase 1: rápido 60ms por nombre, Fase 2: desacelera, Fase 3: nombre final
  const PHASE2=1800, PHASE3=3000;

  function frame(now){
    const elapsed=now-startT;
    // Velocidad: 60ms → 400ms progresivamente
    const speed=elapsed<PHASE2?60:60+((elapsed-PHASE2)/(PHASE3-PHASE2))*340;

    if(elapsed>=PHASE3){
      // Final
      chosen2.textContent=(chosen||'???').substring(0,16).toUpperCase();
      chosen2.classList.add('show');
      badge.classList.add('show');
      setTimeout(()=>{
        stage.classList.remove('show');
        chosen2.classList.remove('show');
        badge.classList.remove('show');
        document.getElementById('bg').className='';
        activateRep(false);
      },2000);
      return;
    }

    if(now-lastSwap>=speed){
      lastSwap=now;
      chosen2.textContent=(pool[idx%pool.length]||'???').substring(0,16).toUpperCase();
      chosen2.classList.add('show');
      idx++;
    }
    normalRAF=requestAnimationFrame(frame);
  }
  normalRAF=requestAnimationFrame(frame);
}

// ══ POLLING — rep_state ══
setInterval(()=>{
  try{
    const raw=localStorage.getItem(LS); if(!raw)return;
    const s=JSON.parse(raw); if(!s.ts||s.ts===lastTs)return;
    lastTs=s.ts;
    if(s.trigger&&s.trigger!==lastTrigger){
      lastTrigger=s.trigger;
      pendingRep={userId:s.repUserId,username:s.repUsername,isMember:!!s.repIsMember};
      if(s.repIsMember) triggerVIP(s.candidates||[],s.chosen);
      else startAnimation(s.candidates||[],s.chosen);
    }
    if(s.clear&&s.clear!==lastClear){lastClear=s.clear;clearRep();}
  }catch(e){}
},300);

// ══ POLLING — TTS mensajes ══
setInterval(()=>{
  try{
    const raw=localStorage.getItem('rep_message'); if(!raw)return;
    const s=JSON.parse(raw); if(!s.ts||s.ts===lastTts)return;
    lastTts=s.ts;
    const ttsEl=document.getElementById('ttsMsg');
    const userEl=document.getElementById('ttsMsgUser');
    const textEl=document.getElementById('ttsMsgText');
    if(!s.text) return;
    userEl.textContent=(repUsername||s.username||'').toUpperCase();
    textEl.textContent=s.text;
    ttsEl.classList.add('show');
    speakTTS(s.text);
    if(msgTimeout) clearTimeout(msgTimeout);
    msgTimeout=setTimeout(()=>ttsEl.classList.remove('show'),5000);
  }catch(e){}
},300);
