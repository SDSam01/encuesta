<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comodines Control</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a0f;font-family:'Inter',sans-serif;color:#fff;padding:12px;max-width:500px;}
h1{font-size:13px;font-weight:700;margin-bottom:2px;color:#FFD000;}
.sub{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:10px;}

/* Holders */
.holders{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.holder{background:rgba(255,255,255,.04);border-radius:10px;padding:10px;border:1px solid rgba(255,208,0,.15);}
.ht{font-size:9px;font-weight:700;letter-spacing:3px;color:#FFD000;margin-bottom:6px;}
.holder.ch .ht{color:#F59E0B;}
.hcards{display:flex;flex-direction:column;gap:4px;}
.hcard{background:rgba(255,208,0,.06);border-radius:6px;padding:5px 7px;border-left:2px solid #FFD000;font-size:10px;font-weight:700;color:#fff;}
.holder.ch .hcard{border-left-color:#F59E0B;}
.hcard.used{opacity:.4;text-decoration:line-through;}
.hcard.empty{color:rgba(255,255,255,.2);border-left-color:rgba(255,255,255,.1);background:transparent;}

/* Botón sorteo */
.btn-sorteo{width:100%;padding:10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;background:rgba(255,208,0,.15);border:1px solid rgba(255,208,0,.5);color:#FFD000;margin-bottom:8px;}
.btn-sorteo:hover{background:rgba(255,208,0,.25);}

/* Selectores */
.sel{display:none;border-radius:9px;padding:9px;margin-bottom:7px;border:1px solid rgba(255,208,0,.25);background:rgba(255,208,0,.04);}
.sel.show{display:block;}
.sel.ch{border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.04);}
.sel-title{font-size:9px;letter-spacing:2px;font-weight:700;color:rgba(255,208,0,.7);margin-bottom:6px;}
.sel.ch .sel-title{color:rgba(245,158,11,.7);}
.num-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;}
.nb{padding:5px 2px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;background:rgba(255,208,0,.1);border:1px solid rgba(255,208,0,.2);color:#FFD000;text-align:center;transition:.12s;}
.sel.ch .nb{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.2);color:#F59E0B;}
.nb:hover:not(:disabled){opacity:.7;}
.nb:disabled{opacity:.2;cursor:not-allowed;}

/* Botones acción */
.ag{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px;}
.ba{padding:7px 5px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;border:1px solid;transition:.12s;text-align:center;}
.ba:disabled{opacity:.25;cursor:not-allowed;}
.ba:not(:disabled):hover{opacity:.75;}
.rev1{background:rgba(255,208,0,.08);border-color:rgba(255,208,0,.35);color:#FFD000;}
.rev2{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.35);color:#F59E0B;}
.act{background:rgba(255,208,0,.15);border-color:rgba(255,208,0,.55);color:#FFD000;}
.act.ch{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.55);color:#F59E0B;}
.wide{grid-column:1/-1;}
.btn-compact{background:rgba(255,208,0,.06);border-color:rgba(255,208,0,.28);color:rgba(255,208,0,.65);grid-column:1/-1;}
.btn-em{background:rgba(255,80,80,.07);border-color:rgba(255,80,80,.3);color:rgba(255,100,100,.7);grid-column:1/-1;font-size:9px;}
.btn-hide{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.1);color:rgba(255,255,255,.35);grid-column:1/-1;font-size:9px;}

.bg{padding:7px 4px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;
  font-family:'Inter',sans-serif;transition:.12s;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.45);}
.bg:hover{background:rgba(255,208,0,.12);border-color:rgba(255,208,0,.4);color:#FFD000;}
.bg:disabled{opacity:.3;cursor:not-allowed;}
.bg.usado{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.07);
  color:rgba(255,255,255,.2);text-decoration:line-through;}
.bg.activo{background:rgba(255,208,0,.16);border-color:rgba(255,208,0,.6);color:#FFD000;}

/* Selector de formato */
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px;}
.bf{padding:8px 5px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;text-align:center;transition:.12s;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.35);}
.bf:hover{opacity:.8;}
.bf.on{background:rgba(255,208,0,.15);border-color:rgba(255,208,0,.55);color:#FFD000;}

/* Referencia */
.rt{font-size:9px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.22);margin-bottom:4px;}
.rnote{font-size:9px;color:rgba(255,208,0,.35);margin-bottom:7px;font-style:italic;}
.rg{display:flex;flex-direction:column;gap:4px;}
.rr{display:flex;align-items:flex-start;gap:7px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:7px;padding:7px 9px;}
.re{font-size:16px;line-height:1.3;min-width:22px;}
.ri{flex:1;}
.rn{font-size:11px;font-weight:700;color:#fff;margin-bottom:2px;}
.rd{font-size:9px;color:rgba(255,255,255,.42);line-height:1.4;}

.status{font-size:10px;text-align:center;color:rgba(255,255,255,.3);padding:5px;min-height:16px;}
.status.ok{color:#FFD000;}.status.err{color:#f87171;}
</style>
</head>
<body>
<h1>🃏 Comodines Control</h1>
<div class="sub">3 comodines por lado — se sortean al usarlos</div>

<!-- ══ MODO RULETA ══ -->
<div style="margin:10px 0 6px;padding:9px;border-radius:10px;background:rgba(255,208,0,.05);border:1px solid rgba(255,208,0,.2);">
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#FFD000;font-weight:700;margin-bottom:7px;">🎰 Modo ruleta — 3 por jugador</div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px;">
    <button class="bf on" id="fmtComp" onclick="setMazo('companero')">👥 Compañero</button>
    <button class="bf" id="fmtPuerta" onclick="setMazo('puerta')">🚪 Puerta</button>
  </div>

  <button class="bg" id="btnHud" style="width:100%;margin-bottom:8px;padding:9px;font-size:12px;" onclick="toggleHud()">✨ Mostrar HUD</button>

  <div style="font-size:10px;color:rgba(255,255,255,.4);margin:5px 0 3px;">SAM</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;">
    <button class="bg" id="gSam0" onclick="girar('sam',0)">🃏 1</button>
    <button class="bg" id="gSam1" onclick="girar('sam',1)">🃏 2</button>
    <button class="bg" id="gSam2" onclick="girar('sam',2)">🃏 3</button>
  </div>

  <div style="font-size:10px;color:rgba(255,255,255,.4);margin:7px 0 3px;">CHAT</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;">
    <button class="bg" id="gChat0" onclick="girar('chat',0)">🃏 1</button>
    <button class="bg" id="gChat1" onclick="girar('chat',1)">🃏 2</button>
    <button class="bg" id="gChat2" onclick="girar('chat',2)">🃏 3</button>
  </div>

  <button class="bg" style="width:100%;margin-top:7px;" onclick="resetRuleta()">🔄 Reiniciar slots</button>
</div>

<div class="ag">
  <button class="ba wide btn-em" onclick="resetEmergencia()">🔄 RESET EMERGENCIA</button>
</div>

<div class="rt">Referencia — qué hace cada comodín</div>
<div class="rnote">ℹ️ En orden distinto al mazo — no muestra posición</div>
<div class="rg" id="refGrid"></div>
<div class="status" id="statusBar"></div>

<script>
const LS='comodines_state';
const MAZO_RULETA=[
  {emoji:'🎲',titulo:'Aura o Laura',      desc:'50/50 al instante: ganas o pierdes media vida.'},
  {emoji:'🔄',titulo:'Buena mala suerte', desc:'Esta ronda el rival tiene que responder MAL para ganar.'},
  {emoji:'⚔️',titulo:'Error de rata',     desc:'Si el rival falla esta ronda, pierde 1 vida en vez de media.'},
  {emoji:'🩸',titulo:'Robo de vida',      desc:'Le quitas media vida al rival y te la sumas.'},
  {emoji:'🔀',titulo:'Ruleta de vidas',   desc:'Las vidas de Sam y Chat se intercambian.'},
  {emoji:'😇',titulo:'Ángel de la guarda',desc:'Te blinda de perder con media vida.'},
  {emoji:'⚖️',titulo:'Tregua',            desc:'Esta ronda nadie pierde vida, pase lo que pase.'},
  {emoji:'🎭',titulo:'Cambiar Personaje', desc:'Guardado: actívalo cuando quieras. El rep responde como el personaje que Sam elija.'},
  {emoji:'🎁',titulo:'Doble premio',      desc:'Si ganas esta ronda, media vida extra.'},
  {emoji:'🔗',titulo:'Destino compartido',desc:'Esta ronda si uno pierde vida, el otro también.'},
  {emoji:'🎰',titulo:'Todo o nada',       desc:'Ganas la ronda: +1 vida. La pierdes: -1 vida.'},
];

const MAZO_COMPANERO=[
  {emoji:'🎲',titulo:'Aura o Laura',     desc:'Ganas o pierdes media vida al azar. 50/50.'},
  {emoji:'🔄',titulo:'Buena mala suerte',desc:'El rival tiene que votar mal para ganar esta ronda.'},
  {emoji:'⚔️',titulo:'Error de rata',    desc:'Si el rival falla, pierde 1 vida completa en lugar de media.'},
  {emoji:'🩸',titulo:'Robo de vida',     desc:'Le robas media vida al rival y te la sumas.'},
  {emoji:'🔀',titulo:'Ruleta de vidas',  desc:'Las vidas de Sam y Chat se intercambian completamente.'},
  {emoji:'✨',titulo:'Resurrección',     desc:'Si pierdes tu última vida, revives con media vida.'},
  {emoji:'⚖️',titulo:'Tregua',           desc:'Nadie pierde vida esta ronda, pase lo que pase.'},
  {emoji:'🚫',titulo:'Anular',           desc:'Cancelas el comodín que el rival active esta ronda.'},
  {emoji:'🎣',titulo:'Robo de comodín',  desc:'Le quitas al rival un comodín sin usar y te lo quedas.'},
  {emoji:'🎭',titulo:'Cambiar Personaje',desc:'El representante del chat responde en el personaje que Sam elija al momento.'},
];

const MAZO_PUERTA=[
  {emoji:'🚪',titulo:'Cambio de puerta', desc:'Después de elegir, puedes cambiarte a otra puerta.'},
  {emoji:'👥',titulo:'Copiar',           desc:'Eliges la misma puerta que el rival.'},
  {emoji:'🔒',titulo:'Bloqueo',          desc:'Bloqueas una puerta para que el rival no la pueda usar.'},
  {emoji:'🛡️',titulo:'Escudo',           desc:'Tu próximo error no te quita vida. Un fallo gratis.'},
  {emoji:'🩸',titulo:'Robo de vida',     desc:'Le robas media vida al rival y te la sumas.'},
  {emoji:'🎲',titulo:'Lotería',          desc:'Ganas o pierdes media vida al azar. 50/50.'},
  {emoji:'💀',titulo:'Error letal',      desc:'Si el rival falla esta ronda, pierde 1 vida completa en lugar de media.'},
  {emoji:'🍀',titulo:'Suertudo',         desc:'Si eliges bien recuperas 1 vida completa.'},
  {emoji:'⚖️',titulo:'Tregua',           desc:'Esta ronda nadie pierde vida, pase lo que pase.'},
  {emoji:'🎁',titulo:'Doble premio',     desc:'Si ganas esta ronda, media vida extra.'},
  {emoji:'🔗',titulo:'Destino compartido',desc:'Esta ronda si uno pierde vida, el otro también.'},
];

// Mazo activo — cambia según el formato seleccionado
let formato = localStorage.getItem('comodines_formato') || 'companero';
let TODOS = (formato==='puerta') ? MAZO_PUERTA : MAZO_COMPANERO;

let mazo=[];
let samPicks=[null,null],chatPicks=[null,null];
let samUsed=[false,false],chatUsed=[false,false];
let samStep=0,chatStep=0;

function setFormato(f){
  formato = f;
  TODOS = (f==='puerta') ? MAZO_PUERTA : MAZO_COMPANERO;
  localStorage.setItem('comodines_formato', f);
  const a=document.getElementById('fmtComp'), b=document.getElementById('fmtPuerta');
  if(a) a.className = 'bf' + (f==='companero' ? ' on' : '');
  if(b) b.className = 'bf' + (f==='puerta' ? ' on' : '');
  renderRef();
  setStatus(f==='puerta' ? 'Formato: Elige tu puerta — aplica al próximo sorteo' : 'Formato: Elige tu compañero — aplica al próximo sorteo','ok');
}


// ══ MODO RULETA ══
const PERSIST = ['Ángel de la guarda','Cambiar Personaje'];
let slots = {sam:[null,null,null], chat:[null,null,null]};
let girando = false;

let mazoActivo = localStorage.getItem('comodines_formato') || 'companero';
function pool(){ return mazoActivo==='puerta' ? MAZO_PUERTA : MAZO_RULETA; }

function setMazo(f){
  mazoActivo = f;
  localStorage.setItem('comodines_formato', f);
  const a=document.getElementById('fmtComp'), b=document.getElementById('fmtPuerta');
  if(a) a.className='bf'+(f==='companero'?' on':'');
  if(b) b.className='bf'+(f==='puerta'?' on':'');
  renderRef();
  setStatus(f==='puerta'?'🚪 Mazo: Elige tu puerta':'👥 Mazo: Elige tu compañero','ok');
}

let hudVisible = false;
function toggleHud(){
  hudVisible = !hudVisible;
  save({action: hudVisible ? 'showHud' : 'hideHud'});
  const b=document.getElementById('btnHud');
  b.textContent = hudVisible ? '🙈 Ocultar HUD' : '✨ Mostrar HUD';
  b.className = 'bg' + (hudVisible ? ' activo' : '');
  setStatus(hudVisible ? '✨ HUD en pantalla' : 'HUD oculto','ok');
}

function girar(side, slot){
  if(girando) return;
  if(slots[side][slot]) { setStatus('Ese slot ya se usó','err'); return; }
  girando = true;

  // Sorteo con repetición permitida
  const P = pool();
  const ganador = P[Math.floor(Math.random()*P.length)];
  slots[side][slot] = ganador;

  save({action:'girar', side, slot, ganador, pool:P});
  setStatus(`🎰 Girando para ${side==='sam'?'Sam':'Chat'}...`, 'loading');

  // La animación del overlay dura ~6s
  setTimeout(()=>{
    girando = false;
    pintarBtn(side, slot);
    const p = PERSIST.includes(ganador.titulo);
    setStatus(`${ganador.emoji} ${ganador.titulo}${p?' — QUEDA ACTIVO':''}`, 'ok');
  }, 6100);
}

function pintarBtn(side, slot){
  const b = document.getElementById('g'+(side==='sam'?'Sam':'Chat')+slot);
  if(!b) return;
  const c = slots[side][slot];
  if(!c) { b.className='bg'; b.textContent='🃏 '+(slot+1); return; }
  b.textContent = c.emoji+' '+c.titulo.slice(0,11);
  b.className = 'bg activo';
}

function resetRuleta(){
  slots = {sam:[null,null,null], chat:[null,null,null]};
  girando = false;
  ['sam','chat'].forEach(s=>[0,1,2].forEach(i=>pintarBtn(s,i)));
  save({action:'resetSlots'});
  setStatus('🔄 Slots reiniciados','ok');
}

function iniciarSorteo(){
  mazo=[...TODOS].sort(()=>Math.random()-.5);
  samPicks=[null,null];chatPicks=[null,null];
  samUsed=[false,false];chatUsed=[false,false];
  samStep=0;chatStep=0;
  updateHolderUI();updateBtns();
  hideAllSel();
  showSel('selSam0');renderGrid('ngSam0','sam',0);
  save({action:'sorteo',mazo});
  setStatus('Mazo iniciado — elige tu primera carta','ok');
}

function showSel(id){document.getElementById(id).classList.add('show');}
function hideSel(id){document.getElementById(id).classList.remove('show');}
function hideAllSel(){['selSam0','selSam1','selChat0','selChat1'].forEach(id=>hideSel(id));}

function renderGrid(gridId,side,slot){
  const g=document.getElementById(gridId);g.innerHTML='';
  const blocked=new Set([
    ...samPicks.filter(x=>x!==null).map(x=>mazo.indexOf(x)),
    ...chatPicks.filter(x=>x!==null).map(x=>mazo.indexOf(x)),
  ]);
  // Quitar el actual slot del blocked
  const currentIdx=side==='sam'?mazo.indexOf(samPicks[slot]):mazo.indexOf(chatPicks[slot]);
  if(currentIdx>=0)blocked.delete(currentIdx);

  mazo.forEach((_,i)=>{
    const btn=document.createElement('button');
    btn.className='nb';btn.textContent=i+1;
    btn.disabled=blocked.has(i);
    btn.onclick=()=>pick(side,slot,i);
    g.appendChild(btn);
  });
}

function pick(side,slot,idx){
  if(side==='sam'){
    samPicks[slot]=mazo[idx];
    hideSel('selSam'+slot);
    if(slot===0&&samPicks[1]===null){showSel('selSam1');renderGrid('ngSam1','sam',1);}
    else if(samPicks[0]!==null&&samPicks[1]!==null&&chatPicks[0]===null){showSel('selChat0');renderGrid('ngChat0','chat',0);}
  } else {
    chatPicks[slot]=mazo[idx];
    hideSel('selChat'+slot);
    if(slot===0&&chatPicks[1]===null){showSel('selChat1');renderGrid('ngChat1','chat',1);}
  }
  updateHolderUI();updateBtns();
  setStatus(`${side==='sam'?'Sam':'Chat'} eligió carta ${slot+1}: ${mazo[idx].titulo}`,'ok');
}

function revelar(side,slot){
  const picks=side==='sam'?samPicks:chatPicks;
  if(!picks[slot])return;
  const idx=mazo.indexOf(picks[slot]);
  save({action:'choose'+(side==='sam'?'Sam':'Chat')+slot,idx});
  setStatus('Revelando...','ok');
}

function activar(side,slot){
  const picks=side==='sam'?samPicks:chatPicks;
  const used=side==='sam'?samUsed:chatUsed;
  if(!picks[slot]||used[slot])return;
  used[slot]=true;
  save({action:'activate'+(side==='sam'?'Sam':'Chat')+slot});
  updateHolderUI();updateBtns();
  setStatus(`Comodín ${slot+1} de ${side==='sam'?'Sam':'el Chat'} activado`,'ok');
}

function hacerCompacto(){save({action:'compacto'});setStatus('Vista compacta activada','ok');}
function cerrarActivacion(){save({action:'closeAct'});setStatus('Activación cerrada','ok');}
function ocultarTodo(){save({action:'hide'});setStatus('HUD oculto','');}

function resetEmergencia(){
  samPicks=[null,null];chatPicks=[null,null];
  samUsed=[false,false];chatUsed=[false,false];
  samStep=0;chatStep=0;
  hideAllSel();updateHolderUI();updateBtns();
  save({action:'reset'});
  setStatus('🔄 Reset de emergencia completo','ok');
}

function updateHolderUI(){
  if(!document.getElementById('samCards')) return;
  const sc=document.getElementById('samCards');
  const cc=document.getElementById('chatCards');
  sc.innerHTML='';cc.innerHTML='';
  [0,1].forEach(i=>{
    const sd=document.createElement('div');
    if(samPicks[i]){sd.className='hcard'+(samUsed[i]?' used':'');sd.textContent=samPicks[i].emoji+' '+samPicks[i].titulo;}
    else{sd.className='hcard empty';sd.textContent='Carta '+(i+1)+' — sin elegir';}
    sc.appendChild(sd);
    const cd=document.createElement('div');
    if(chatPicks[i]){cd.className='hcard'+(chatUsed[i]?' used':'');cd.textContent=chatPicks[i].emoji+' '+chatPicks[i].titulo;}
    else{cd.className='hcard empty';cd.textContent='Carta '+(i+1)+' — sin elegir';}
    cc.appendChild(cd);
  });
}

function updateBtns(){
  if(!document.getElementById('bRevS0')) return;
  [['bRevS0','sam',0],['bRevS1','sam',1],['bRevC0','chat',0],['bRevC1','chat',1]].forEach(([id,s,i])=>{
    const picks=s==='sam'?samPicks:chatPicks;
    document.getElementById(id).disabled=!picks[i];
  });
  [['bActS0','sam',0],['bActS1','sam',1],['bActC0','chat',0],['bActC1','chat',1]].forEach(([id,s,i])=>{
    const picks=s==='sam'?samPicks:chatPicks;
    const used=s==='sam'?samUsed:chatUsed;
    document.getElementById(id).disabled=!picks[i]||used[i];
  });
}

function save(extra={}){
  localStorage.setItem(LS,JSON.stringify({mazo,samPicks,chatPicks,samUsed,chatUsed,ts:Date.now(),...extra}));
}

function setStatus(msg,type){const el=document.getElementById('statusBar');el.textContent=msg;el.className='status '+(type||'');}

// Referencia en orden alfabético
function renderRef(){
  const g=document.getElementById('refGrid');g.innerHTML='';
  [...pool()].sort((a,b)=>a.titulo.localeCompare(b.titulo)).forEach(c=>{
    const d=document.createElement('div');d.className='rr';
    d.innerHTML=`<div class="re">${c.emoji}</div><div class="ri"><div class="rn">${c.titulo}</div><div class="rd">${c.desc}</div></div>`;
    g.appendChild(d);
  });
}
renderRef();
// Restaurar el formato guardado al cargar (marca el botón correcto)
setMazo(mazoActivo);
</script>
</body>
</html>
